name: Mantener despierto el backend

# Render gratis apaga el servicio tras 15 minutos sin visitas y tarda cerca de
# un minuto en despertar. Esta visita a /health cada 10 minutos lo mantiene listo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar /health
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://gota-de-vida-backend.onrender.com/health
