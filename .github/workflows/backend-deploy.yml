name: Backend deploy

# Al fusionar a main con cambios en backend/, pide a Render que despliegue.
# Requiere el secreto RENDER_DEPLOY_HOOK_URL (Render > servicio > Settings > Deploy Hook).
# En Render, desactiven "Auto-Deploy" para que solo despliegue este workflow.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::Todavía no está configurado RENDER_DEPLOY_HOOK_URL; se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
