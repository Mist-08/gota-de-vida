name: Backend CI

# Corre en cada Pull Request y en cada push a main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar el backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # MongoDB de prueba solo para este job (no toca Atlas).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: gotadevida_ci
      JWT_SECRET: secreto-del-ci-solo-para-pruebas-automaticas
      ADMIN_EMAIL: admin@ci.gotadevida.mx
      ADMIN_PASSWORD: admin-ci-solo-pruebas
      CARGAR_DATOS_DEMO: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pruebas y distribución
        run: |
          chmod +x gradlew
          ./gradlew test installDist

      - name: Levantar el backend con MongoDB
        run: |
          nohup build/install/gota-de-vida-backend/bin/gota-de-vida-backend > build/servidor.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then echo "Backend arriba"; exit 0; fi
            sleep 2
          done
          echo "El backend no arrancó" && cat build/servidor.log && exit 1

      - name: Colección de Postman con Newman
        run: >
          npx --yes newman@6.2.1 run ../docs/api/GotaDeVida.postman_collection.json
          -e ../docs/api/ci.postman_environment.json
          --reporters cli,junit
          --reporter-junit-export build/reports/newman/resultado.xml

      - name: Construir imagen Docker
        run: docker build -t gota-de-vida-backend .

      - name: Subir reportes y bitácora del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            backend/build/reports/
            backend/build/servidor.log
          if-no-files-found: ignore
