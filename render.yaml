# Blueprint de Render (plan gratuito). En Render: New → Blueprint → elijan este repositorio.
# Los valores marcados con sync: false se escriben a mano en Render (nunca en el repo).
services:
  - type: web
    name: gota-de-vida-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    # Despliega solo cuando GitHub Actions llama al deploy hook (después del CI).
    autoDeploy: false
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: gotadevida
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CARGAR_DATOS_DEMO
        value: "true"
      - key: RABBITMQ_URL
        sync: false
      - key: FIREBASE_CREDENCIALES_JSON
        sync: false
      - key: MINUTOS_ENTRE_OLEADAS
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
