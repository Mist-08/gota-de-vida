openapi: 3.0.3
info:
  title: Gota de Vida API
  description: |
    API de Gota de Vida: conecta bancos de sangre de la Comarca Lagunera con donadores
    compatibles y cercanos.

    **Cómo probar aquí:** usa `POST /api/v1/auth/registro` o `POST /api/v1/auth/login`, copia
    `tokens.tokenAcceso` de la respuesta y pégalo en **Authorize**.

    Cada endpoint nuevo se documenta aquí y en la colección de Postman (`docs/api`) en el mismo
    Pull Request. Los errores siempre tienen la forma `ErrorRespuesta`.
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://SU-SERVICIO.onrender.com
    description: Render (cambien SU-SERVICIO por el nombre de su servicio)
tags:
  - name: Salud
  - name: Autenticación
  - name: Donador
  - name: Hospitales
  - name: Reglas de elegibilidad
  - name: Solicitud
    description: Urgencias de sangre. Al publicar una, la cola avisa por oleadas a donadores compatibles, cercanos y elegibles.
  - name: Dispositivos
  - name: Cita
    description: Horarios, agenda, cancelación y check-in con código QR.
  - name: Chatbot
    description: Gota, la asistente. Preguntas frecuentes sin IA, Gemini con function calling y menú de respaldo si se acaba la cuota.
  - name: WhatsApp
    description: Webhook de WhatsApp Cloud API (Meta).
  - name: Donación
    description: Historial, insignias y estadísticas del hospital.
paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio
      description: Úsenlo para despertar el servidor de Render antes de la demo.
      operationId: obtenerSalud
      responses:
        "200":
          description: El servidor está funcionando
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoSalud" }

  /api/v1/auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar un donador
      description: Crea la cuenta y el perfil de donador vacío. Requiere aceptar el aviso de privacidad.
      operationId: registrarDonador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroSolicitud" }
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionRespuesta" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "429": { $ref: "#/components/responses/DemasiadasPeticiones" }

  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión con correo y contraseña
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginSolicitud" }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionRespuesta" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "429": { $ref: "#/components/responses/DemasiadasPeticiones" }

  /api/v1/auth/google:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión con Google
      description: |
        Recibe el `idToken` que obtiene la app con Credential Manager. El servidor lo verifica con
        Google y crea la cuenta de donador la primera vez. Requiere `GOOGLE_CLIENT_ID` en el servidor.
      operationId: iniciarSesionConGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSolicitud" }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionRespuesta" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }

  /api/v1/auth/refrescar:
    post:
      tags: [Autenticación]
      summary: Renovar la sesión con el token de refresco
      operationId: refrescarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefrescoSolicitud" }
      responses:
        "200":
          description: Tokens nuevos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionRespuesta" }
        "401": { $ref: "#/components/responses/NoAutorizado" }

  /api/v1/donadores/me:
    get:
      tags: [Donador]
      summary: Ver mi perfil de donador
      operationId: obtenerMiPerfil
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Perfil del donador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilDonador" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    put:
      tags: [Donador]
      summary: Actualizar mi perfil de donador
      description: |
        Solo cambian los campos que se manden. La ubicación se guarda redondeada a 3 decimales
        (unos 100 m). `fechaUltimaDonacion` se agrega al historial si no estaba.
      operationId: actualizarMiPerfil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarPerfilSolicitud" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilDonador" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/donadores/me/elegibilidad:
    get:
      tags: [Donador]
      summary: ¿Puedo donar hoy?
      description: Evalúa el perfil contra las reglas vigentes. La decisión final siempre es del personal médico.
      operationId: obtenerMiElegibilidad
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Resultado de la evaluación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Elegibilidad" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/hospitales:
    get:
      tags: [Hospitales]
      summary: Listar hospitales
      operationId: listarHospitales
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Hospitales registrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Hospital" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
    post:
      tags: [Hospitales]
      summary: Registrar un hospital (ADMIN)
      operationId: crearHospital
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearHospitalSolicitud" }
      responses:
        "201":
          description: Hospital creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hospital" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/hospitales/{id}:
    get:
      tags: [Hospitales]
      summary: Ver un hospital
      operationId: obtenerHospital
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Hospital
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hospital" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /api/v1/hospitales/{id}/usuarios:
    post:
      tags: [Hospitales]
      summary: Crear la cuenta del banco de sangre de un hospital (ADMIN)
      operationId: crearUsuarioHospital
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioHospitalSolicitud" }
      responses:
        "201":
          description: Cuenta creada con rol HOSPITAL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioPublico" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /api/v1/reglas-elegibilidad:
    get:
      tags: [Reglas de elegibilidad]
      summary: Reglas vigentes para donar
      description: Públicas. La app y el asistente las usan para explicar los requisitos.
      operationId: obtenerReglas
      responses:
        "200":
          description: Reglas vigentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReglasElegibilidad" }
    put:
      tags: [Reglas de elegibilidad]
      summary: Cambiar las reglas (ADMIN)
      description: |
        Las reglas viven en la base de datos porque la NOM-253-SSA1-2025 remite los criterios
        a una guía nacional que puede cambiar. Solo cambian los campos que se manden.
      operationId: actualizarReglas
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarReglasSolicitud" }
      responses:
        "200":
          description: Reglas actualizadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReglasElegibilidad" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/usuarios/me:
    delete:
      tags: [Dispositivos]
      summary: Eliminar mi cuenta (DONADOR)
      description: Derecho de cancelación. Borra la cuenta, el perfil y la conversación, y cancela las citas pendientes. Las donaciones confirmadas quedan solo con un id interno.
      operationId: eliminarMiCuenta
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cuenta eliminada }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/usuarios/me/dispositivo:
    put:
      tags: [Dispositivos]
      summary: Registrar el teléfono para recibir avisos
      description: Guarda el token de Firebase Cloud Messaging del teléfono (máximo 5 por cuenta).
      operationId: registrarDispositivo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispositivoPeticion" }
      responses:
        "204": { description: Token guardado }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }

  /api/v1/solicitudes:
    get:
      tags: [Solicitud]
      summary: Urgencias activas cercanas y compatibles
      description: >
        Solo las urgencias cuyo paciente puede recibir del tipo de sangre del donador, dentro del radio indicado
        (por defecto, la distancia máxima del perfil). Sin lat/lng se usa la zona guardada del donador.
        Ordenadas de la más cercana a la más lejana.
      operationId: listarSolicitudesCercanas
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, schema: { type: number, example: 25.54 } }
        - { name: lng, in: query, schema: { type: number, example: -103.41 } }
        - { name: radioKm, in: query, schema: { type: number, minimum: 1, maximum: 100, example: 15 } }
      responses:
        "200":
          description: Urgencias
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Solicitud" } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Solicitud]
      summary: Publicar una urgencia (HOSPITAL)
      description: Guarda la urgencia y publica el evento `solicitud.creada`; el MatchingConsumer avisa a los primeros 20 donadores dentro de 10 km, y si no se cubre en 15 minutos amplía a 25 y luego a 50 km.
      operationId: publicarSolicitud
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearSolicitudPeticion" }
      responses:
        "201":
          description: Urgencia publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solicitud" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/solicitudes/{id}:
    get:
      tags: [Solicitud]
      summary: Detalle con unidades cubiertas
      description: El donador ve su distancia y su respuesta; el hospital dueño ve además quién aceptó (nombre, teléfono y distancia, nunca la ubicación).
      operationId: obtenerSolicitud
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdSolicitud" }]
      responses:
        "200":
          description: Urgencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solicitud" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /api/v1/solicitudes/{id}/estado:
    patch:
      tags: [Solicitud]
      summary: Cerrar o cancelar una urgencia (HOSPITAL dueño)
      operationId: cambiarEstadoSolicitud
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdSolicitud" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambiarEstadoPeticion" }
      responses:
        "200":
          description: Urgencia actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solicitud" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /api/v1/solicitudes/{id}/respuestas:
    post:
      tags: [Solicitud]
      summary: Aceptar o rechazar una urgencia (DONADOR)
      description: Para aceptar, el donador debe ser compatible y elegible y la urgencia debe seguir activa. Publica `respuesta.registrada`; el SolicitudConsumer actualiza el contador y avisa al hospital.
      operationId: responderSolicitud
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdSolicitud" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponderPeticion" }
      responses:
        "200":
          description: Respuesta registrada; incluye el contador actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solicitud" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /api/v1/hospitales/me/solicitudes:
    get:
      tags: [Solicitud]
      summary: Urgencias de mi hospital (HOSPITAL)
      operationId: listarSolicitudesDeMiHospital
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Últimas 50 urgencias con quién aceptó
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Solicitud" } }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/hospitales/{id}/horarios:
    get:
      tags: [Cita]
      summary: Horarios disponibles de un hospital
      description: De 8:00 a 13:30 cada media hora, 3 lugares por horario. No se ofrecen horarios a menos de 30 minutos.
      operationId: horariosDisponibles
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: fecha, in: query, schema: { type: string, format: date, example: "2026-11-13" } }
      responses:
        "200":
          description: Horarios del día
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Horario" } }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /api/v1/citas:
    post:
      tags: [Cita]
      summary: Agendar cita (DONADOR)
      description: Valida horario, cupo, que el donador pueda donar en esa fecha y que no tenga otra cita. Publica `cita.agendada` (recordatorios 24 h y 2 h antes).
      operationId: agendarCita
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendarCitaPeticion" }
      responses:
        "201":
          description: Cita agendada con su código QR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cita" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /api/v1/citas/me:
    get:
      tags: [Cita]
      summary: Mis citas (DONADOR)
      operationId: misCitas
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Citas, la más reciente primero
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Cita" } }

  /api/v1/citas/{id}/cancelar:
    post:
      tags: [Cita]
      summary: Cancelar mi cita (DONADOR)
      operationId: cancelarCita
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Cita cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cita" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /api/v1/citas/{id}/checkin:
    post:
      tags: [Cita]
      summary: Confirmar la donación con el código (HOSPITAL)
      description: Marca la cita como completada y publica `donacion.confirmada`; el HistorialConsumer registra la donación, recalcula la próxima fecha y manda el agradecimiento.
      operationId: checkinCita
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinPeticion" }
      responses:
        "200":
          description: Donación confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cita" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /api/v1/citas/checkin-qr:
    post:
      tags: [Cita]
      summary: Confirmar la donación escaneando el QR (HOSPITAL)
      description: "El QR de la app contiene `gota:<citaId>:<codigo>`."
      operationId: checkinConQr
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinPeticion" }
      responses:
        "200":
          description: Donación confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cita" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /api/v1/hospitales/me/citas:
    get:
      tags: [Cita]
      summary: Citas agendadas de mi hospital (HOSPITAL)
      operationId: citasDeMiHospital
      security: [{ bearerAuth: [] }]
      parameters: [{ name: fecha, in: query, schema: { type: string, format: date } }]
      responses:
        "200":
          description: Citas del día
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Cita" } }

  /api/v1/donaciones/me:
    get:
      tags: [Donación]
      summary: Mi historial (DONADOR)
      description: Donaciones, vidas que puedes ayudar (3 por donación), próxima fecha e insignias.
      operationId: miHistorial
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Historial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Historial" }

  /api/v1/hospitales/me/estadisticas:
    get:
      tags: [Donación]
      summary: Estadísticas del panel (HOSPITAL)
      operationId: estadisticasDeMiHospital
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Métricas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estadisticas" }

  /api/v1/chat/mensajes:
    post:
      tags: [Chatbot]
      summary: Mandar un mensaje a Gota (DONADOR)
      description: >
        Orden para ahorrar cuota: opciones del menú y botones sin IA, luego preguntas frecuentes de la base,
        luego Gemini con function calling. Si Gemini no está configurado o responde 429, contesta con el menú.
        A Gemini nunca se le mandan nombres, teléfonos, correos ni ubicaciones.
      operationId: mandarMensaje
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, example: "¿Tengo que ir en ayunas?" }
      responses:
        "200":
          description: Respuesta de Gota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaChat" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "403": { $ref: "#/components/responses/Prohibido" }
    get:
      tags: [Chatbot]
      summary: Historial de la conversación (DONADOR)
      operationId: historialChat
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Últimos 30 mensajes (app y WhatsApp)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensajes:
                    type: array
                    items:
                      type: object
                      properties:
                        autor: { type: string, enum: [DONADOR, GOTA] }
                        texto: { type: string }
                        en: { type: string, format: date-time }

  /api/v1/webhooks/whatsapp:
    get:
      tags: [WhatsApp]
      summary: Verificación del webhook (Meta)
      operationId: verificarWebhook
      parameters:
        - { name: hub.mode, in: query, schema: { type: string, example: subscribe } }
        - { name: hub.verify_token, in: query, schema: { type: string } }
        - { name: hub.challenge, in: query, schema: { type: string } }
      responses:
        "200": { description: Devuelve hub.challenge }
        "403": { description: Token de verificación incorrecto }
    post:
      tags: [WhatsApp]
      summary: Mensajes entrantes (Meta)
      description: Verifica la firma `X-Hub-Signature-256`, publica `whatsapp.mensaje.recibido` y responde 200 de inmediato; el ChatbotConsumer contesta por WhatsApp.
      operationId: recibirWhatsApp
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string, example: "sha256=ab12..." } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Recibido }
        "401": { description: Firma inválida }
        "429": { $ref: "#/components/responses/DemasiadasPeticiones" }

components:
  parameters:
    IdSolicitud:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`tokens.tokenAcceso` de la respuesta de login o registro. Dura 1 hora."

  responses:
    DatosInvalidos:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
          example: { error: datos_invalidos, mensaje: "El celular debe tener 10 dígitos." }
    NoAutorizado:
      description: Falta iniciar sesión o las credenciales son incorrectas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
          example: { error: no_autorizado, mensaje: "Inicia sesión para continuar." }
    Prohibido:
      description: El rol del usuario no permite esta acción
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
          example: { error: prohibido, mensaje: "No tienes permiso para esta acción." }
    NoEncontrado:
      description: No existe el recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
    Conflicto:
      description: Ya existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
          example: { error: conflicto, mensaje: "Ya existe una cuenta con ese correo." }
    DemasiadasPeticiones:
      description: Demasiados intentos; espera un minuto

  schemas:
    RespuestaChat:
      type: object
      properties:
        respuesta: { type: string, example: "Llega con 4 a 12 horas de ayuno y evita grasas, huevo y lácteos desde un día antes." }
        opciones: { type: array, items: { type: string }, example: ["08:00", "09:30", "11:00"] }
        origen: { type: string, enum: [MENU, PREGUNTA_FRECUENTE, GEMINI] }
    Horario:
      type: object
      properties:
        hora: { type: string, example: "09:30" }
        lugares: { type: integer, example: 2 }
        disponible: { type: boolean }
    AgendarCitaPeticion:
      type: object
      required: [hospitalId, fechaHora]
      properties:
        hospitalId: { type: string }
        fechaHora: { type: string, description: Hora local de La Laguna, example: "2026-11-13T09:30" }
        solicitudId: { type: string, description: Urgencia que aceptó (opcional) }
    CheckinPeticion:
      type: object
      required: [codigoQr]
      properties:
        codigoQr: { type: string, example: "gota:3f6e...:Xk2pQ9" }
    Cita:
      type: object
      properties:
        id: { type: string }
        hospitalId: { type: string }
        hospitalNombre: { type: string }
        hospitalDireccion: { type: string }
        latitud: { type: number }
        longitud: { type: number }
        fechaHora: { type: string, example: "2026-11-13T09:30" }
        estado: { type: string, enum: [AGENDADA, CANCELADA, COMPLETADA] }
        solicitudId: { type: string }
        codigoQr: { type: string, description: Solo para el donador }
        donadorNombre: { type: string, description: Solo para el hospital }
    Historial:
      type: object
      properties:
        donaciones:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              hospitalNombre: { type: string }
              fecha: { type: string, format: date }
              porUrgencia: { type: boolean }
        totalDonaciones: { type: integer }
        vidasQuePuedesAyudar: { type: integer }
        elegible: { type: boolean }
        proximaFechaElegible: { type: string, format: date }
        insignias:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string, enum: [PRIMERA_DONACION, TRES_DONACIONES, CINCO_DONACIONES, HEROE_DE_URGENCIA] }
              obtenida: { type: boolean }
    Estadisticas:
      type: object
      properties:
        urgenciasTotales: { type: integer }
        urgenciasActivas: { type: integer }
        urgenciasCubiertas: { type: integer }
        minutosPromedioParaCubrir: { type: integer }
        tiposMasSolicitados:
          type: array
          items:
            type: object
            properties:
              etiquetaTipoSangre: { type: string }
              urgencias: { type: integer }
        donacionesConfirmadas: { type: integer }
        citasHoy: { type: integer }
    DispositivoPeticion:
      type: object
      required: [tokenFcm]
      properties:
        tokenFcm: { type: string, example: "dK3x...token-de-firebase" }
    EstadoSolicitud:
      type: string
      enum: [ACTIVA, CUBIERTA, CERRADA, CANCELADA]
    CrearSolicitudPeticion:
      type: object
      required: [tipoSangre, unidades]
      properties:
        tipoSangre: { $ref: "#/components/schemas/TipoSangre" }
        unidades: { type: integer, minimum: 1, maximum: 20, example: 3 }
        nota: { type: string, maxLength: 200, example: "Paciente en quirófano, piso 3" }
    CambiarEstadoPeticion:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [CERRADA, CANCELADA] }
    ResponderPeticion:
      type: object
      required: [acepta]
      properties:
        acepta: { type: boolean, example: true }
    DonadorQueAcepto:
      type: object
      properties:
        donadorId: { type: string }
        nombre: { type: string, example: "Mariana Rodríguez" }
        telefono: { type: string, example: "+528711234567" }
        distanciaKm: { type: number, example: 3.2 }
        respondioEn: { type: string, format: date-time }
    Solicitud:
      type: object
      properties:
        id: { type: string }
        hospitalId: { type: string }
        hospitalNombre: { type: string, example: "Hospital Universitario de Torreón" }
        hospitalDireccion: { type: string }
        latitud: { type: number }
        longitud: { type: number }
        tipoSangre: { $ref: "#/components/schemas/TipoSangre" }
        etiquetaTipoSangre: { type: string, example: "O−" }
        unidades: { type: integer, example: 3 }
        unidadesComprometidas: { type: integer, example: 2 }
        estado: { $ref: "#/components/schemas/EstadoSolicitud" }
        creadaEn: { type: string, format: date-time }
        nota: { type: string }
        distanciaKm: { type: number, description: Solo para el donador, example: 4.1 }
        miRespuesta: { type: boolean, description: Solo para el donador }
        oleada: { type: integer, description: Solo para el hospital }
        donadoresNotificados: { type: integer, description: Solo para el hospital }
        aceptaciones:
          type: array
          description: Solo para el hospital dueño
          items: { $ref: "#/components/schemas/DonadorQueAcepto" }
    ErrorRespuesta:
      type: object
      required: [error, mensaje]
      properties:
        error: { type: string, example: datos_invalidos }
        mensaje: { type: string, example: "Escribe un correo válido." }

    EstadoSalud:
      type: object
      required: [estado, servicio, version]
      properties:
        estado: { type: string, example: ok }
        servicio: { type: string, example: gota-de-vida-backend }
        version: { type: string, example: 0.1.0 }

    Rol:
      type: string
      enum: [DONADOR, HOSPITAL, ADMIN]

    TipoSangre:
      type: string
      enum: [O_NEGATIVO, O_POSITIVO, A_NEGATIVO, A_POSITIVO, B_NEGATIVO, B_POSITIVO, AB_NEGATIVO, AB_POSITIVO]

    SexoParaCriteriosMedicos:
      type: string
      description: Solo se usa para calcular intervalos y máximos anuales.
      enum: [FEMENINO, MASCULINO]

    RegistroSolicitud:
      type: object
      required: [nombre, email, password, telefono, aceptaAvisoPrivacidad]
      properties:
        nombre: { type: string, example: Mariana Rodríguez }
        email: { type: string, format: email, example: mariana@correo.mx }
        password: { type: string, minLength: 8, example: contrasena-segura }
        telefono: { type: string, description: "Celular de México, 10 dígitos", example: "871 123 4567" }
        aceptaAvisoPrivacidad: { type: boolean, example: true }

    LoginSolicitud:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: mariana@correo.mx }
        password: { type: string, example: contrasena-segura }

    GoogleSolicitud:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string }

    RefrescoSolicitud:
      type: object
      required: [tokenRefresco]
      properties:
        tokenRefresco: { type: string }

    UsuarioHospitalSolicitud:
      type: object
      required: [nombre, email, password]
      properties:
        nombre: { type: string, example: Banco de sangre HU }
        email: { type: string, format: email, example: banco@hu.mx }
        password: { type: string, minLength: 8 }

    Tokens:
      type: object
      required: [tokenAcceso, tokenRefresco, expiraEnSegundos]
      properties:
        tokenAcceso: { type: string }
        tokenRefresco: { type: string }
        expiraEnSegundos: { type: integer, example: 3600 }

    UsuarioPublico:
      type: object
      required: [id, nombre, email, rol]
      properties:
        id: { type: string }
        nombre: { type: string }
        email: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
        hospitalId: { type: string, nullable: true }

    SesionRespuesta:
      type: object
      required: [usuario, tokens]
      properties:
        usuario: { $ref: "#/components/schemas/UsuarioPublico" }
        tokens: { $ref: "#/components/schemas/Tokens" }

    ActualizarPerfilSolicitud:
      type: object
      properties:
        nombre: { type: string }
        telefono: { type: string }
        tipoSangre: { $ref: "#/components/schemas/TipoSangre" }
        fechaNacimiento: { type: string, format: date, example: "2001-03-14" }
        pesoKg: { type: number, example: 68 }
        sexoParaCriteriosMedicos: { $ref: "#/components/schemas/SexoParaCriteriosMedicos" }
        latitud: { type: number, example: 25.5412 }
        longitud: { type: number, example: -103.4068 }
        zona: { type: string, example: "Torreón Jardín, Torreón" }
        fechaUltimaDonacion: { type: string, format: date, example: "2026-07-12" }
        fechaUltimoTatuaje: { type: string, format: date }
        notificacionesActivas: { type: boolean }
        radioMaximoKm: { type: integer, minimum: 1, maximum: 100, example: 15 }

    PerfilDonador:
      type: object
      required: [id, nombre, notificacionesActivas, radioMaximoKm, totalDonaciones, perfilCompleto]
      properties:
        id: { type: string }
        nombre: { type: string }
        notificacionesActivas: { type: boolean }
        radioMaximoKm: { type: integer }
        totalDonaciones: { type: integer }
        perfilCompleto: { type: boolean }
        telefono: { type: string }
        tipoSangre: { $ref: "#/components/schemas/TipoSangre" }
        etiquetaTipoSangre: { type: string, example: "O−" }
        fechaNacimiento: { type: string, format: date }
        pesoKg: { type: number }
        sexoParaCriteriosMedicos: { $ref: "#/components/schemas/SexoParaCriteriosMedicos" }
        latitud: { type: number, description: "Redondeada a 3 decimales" }
        longitud: { type: number, description: "Redondeada a 3 decimales" }
        zona: { type: string }
        ultimaDonacion: { type: string, format: date }

    Elegibilidad:
      type: object
      required: [elegible, faltanDatos, motivos, aviso]
      properties:
        elegible: { type: boolean, example: false }
        faltanDatos: { type: boolean, example: false }
        motivos:
          type: array
          items: { type: string }
          example: ["Deben pasar 60 días entre donaciones."]
        aviso: { type: string, example: "La decisión final de donar la toma el personal médico del banco de sangre." }
        proximaFechaElegible: { type: string, format: date, example: "2027-01-11" }
        diasParaVolverADonar: { type: integer, example: 60 }

    CrearHospitalSolicitud:
      type: object
      required: [nombre, direccion, municipio, latitud, longitud]
      properties:
        nombre: { type: string, example: Hospital Universitario de Torreón }
        direccion: { type: string, example: "Centro, Torreón" }
        municipio: { type: string, example: Torreón }
        latitud: { type: number, example: 25.5428 }
        longitud: { type: number, example: -103.4068 }
        telefono: { type: string }

    Hospital:
      type: object
      required: [id, nombre, direccion, municipio, latitud, longitud, esDemostracion]
      properties:
        id: { type: string }
        nombre: { type: string }
        direccion: { type: string }
        municipio: { type: string }
        latitud: { type: number }
        longitud: { type: number }
        telefono: { type: string }
        esDemostracion: { type: boolean, description: "Datos de ejemplo cargados al arrancar" }

    ReglasElegibilidad:
      type: object
      properties:
        _id: { type: string, example: vigentes }
        edadMinima: { type: integer, example: 18 }
        edadMaxima: { type: integer, example: 65 }
        pesoMinimoKg: { type: number, example: 50 }
        diasEntreDonaciones: { type: integer, example: 60 }
        maxDonacionesAnualesMasculino: { type: integer, example: 4 }
        maxDonacionesAnualesFemenino: { type: integer, example: 3 }
        horasAyunoMinimo: { type: integer, example: 4 }
        horasAyunoMaximo: { type: integer, example: 12 }
        mesesEsperaTatuaje: { type: integer, example: 12 }
        requisitos:
          type: array
          items: { type: string }
        fuente: { type: string }
        actualizadoEn: { type: string, format: date-time }

    ActualizarReglasSolicitud:
      type: object
      description: Solo cambian los campos que se manden.
      properties:
        edadMinima: { type: integer }
        edadMaxima: { type: integer }
        pesoMinimoKg: { type: number }
        diasEntreDonaciones: { type: integer, minimum: 28, maximum: 365 }
        maxDonacionesAnualesMasculino: { type: integer }
        maxDonacionesAnualesFemenino: { type: integer }
        horasAyunoMinimo: { type: integer }
        horasAyunoMaximo: { type: integer }
        mesesEsperaTatuaje: { type: integer }
        requisitos:
          type: array
          items: { type: string }
        fuente: { type: string }
